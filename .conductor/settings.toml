"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Runs once when a workspace is created, local and cloud alike. Idempotent —
# bundle install, prepare the SQLite database, seed example tasks. On a
# Conductor cloud workspace it also points the workspace's preview URL at the
# dev server (:3000).
setup = "bash scripts/setup.sh"
# The workspace's Run button.
run = "bash scripts/dev.sh"
